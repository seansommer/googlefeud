<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#100b38" />
    <meta name="description" content="A fast, family-friendly autocomplete guessing game." />
    <meta property="og:title" content="Google Fued" />
    <meta property="og:description" content="Can your answer climb the autocomplete board?" />
    <title>Google Fued</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <body>
    <div id="app" aria-live="polite">
      <div class="boot-screen">
        <div class="logo-mark" aria-hidden="true"><span>?</span></div>

    <script type="module" src="./src/app.js"></script>
